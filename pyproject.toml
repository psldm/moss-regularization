[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moss-regularization"
version = "0.4.0"
description = "Physically-grounded nonlinear vacuum damping regularization library for CFD and N-body simulations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Eva Moss", email = "eva@m0ss.io" },
]
maintainers = [
    { name = "Eva Moss", email = "eva@m0ss.io" },
]
keywords = ["cfd", "n-body", "regularization", "vacuum", "damping", "planck"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/psldm/moss-regularization"
Repository = "https://github.com/psldm/moss-regularization"
Changelog = "https://github.com/psldm/moss-regularization/blob/main/CHANGELOG.md"
Issues = "https://github.com/psldm/moss-regularization/issues"

[project.scripts]
moss-reg = "moss_reg.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moss_reg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
