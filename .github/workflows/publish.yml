name: Publish to PyPI

# Publishes the sdist and wheel when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC): no token is stored in the repository.
# One-time setup on pypi.org: Account -> Publishing -> add a pending
# publisher with owner "psldm", repository "moss-regularization",
# workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          moss-reg validate
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release' && github.repository == 'psldm/moss-regularization'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
